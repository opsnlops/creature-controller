name: Build Debian Packages

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: controller
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Build both Debian packages
        run: ./make_packages.sh

      - name: Verify both Debian packages
        shell: bash
        run: |
          shopt -s nullglob
          expected_arch=$(dpkg --print-architecture)
          for package_name in creature-controller creature-audio-router; do
            packages=(package/"${package_name}"_*.deb)
            if [ "${#packages[@]}" -ne 1 ]; then
              echo "Expected exactly one ${package_name} Debian package, found ${#packages[@]}" >&2
              exit 1
            fi
            test "$(dpkg-deb --field "${packages[0]}" Package)" = "$package_name"
            test "$(dpkg-deb --field "${packages[0]}" Architecture)" = "$expected_arch"
            dpkg-deb --info "${packages[0]}"
          done

      - name: Upload creature-controller package
        uses: actions/upload-artifact@v4
        with:
          name: creature-controller-package-${{ matrix.os }}
          path: ${{ github.workspace }}/controller/package/creature-controller_*.deb
          if-no-files-found: error
          # Keep per-commit package storage bounded; rebuild older commits.
          retention-days: 7

      - name: Upload creature-audio-router package
        uses: actions/upload-artifact@v4
        with:
          name: creature-audio-router-package-${{ matrix.os }}
          path: ${{ github.workspace }}/controller/package/creature-audio-router_*.deb
          if-no-files-found: error
          retention-days: 7
